name: Build Windows EXE
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter *.zip -File | Select-Object -First 1
          if ($zip) {
            Expand-Archive -Path $zip.FullName -DestinationPath work -Force
            $app = Get-ChildItem -Path work -Recurse -Filter app.py | Select-Object -First 1
          } else {
            $app = Get-ChildItem -Path . -Recurse -Filter app.py | Select-Object -First 1
          }
          if (-not $app) { Write-Error "app.py پیدا نشد؛ فایل zip را در ریشهٔ مخزن آپلود کنید"; exit 1 }
          "PROJECT=$($app.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Xray
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray -Force
          Copy-Item xray\xray.exe "$env:PROJECT\xray.exe"

      - name: Build exe
        shell: pwsh
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller
          pyinstaller --noconfirm --onefile --noconsole --name MyVPN --icon icon.ico `
            --add-binary "xray.exe;." --add-data "ui;ui" app.py
          if (-not (Test-Path dist\MyVPN.exe)) { Write-Error "ساخت exe ناموفق بود"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: MyVPN-Windows
          path: ${{ env.PROJECT }}/dist/MyVPN.exe
